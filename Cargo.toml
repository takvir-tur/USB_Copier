[package]
name = "usb-tray-sync"
version = "0.1.0"
edition = "2024"
description = "Cross-platform background system tray utility that automatically backs up and safely ejects USB flash drives."
authors = ["USBBackup Contributors"]
license = "MIT"
default-run = "usb-tray-sync"

[[bin]]
name = "usb-tray-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6.0.0"
env_logger = "0.11.11"
fs_extra = "1.3.0"
log = "0.4.35"
notify = "8.2.1"
open = "5.4.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tao = "0.37.2"
tray-icon = "0.26.1"
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
libc = "0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[package.metadata.bundle]
name = "USBBackup"
identifier = "com.usbbackup.app"
version = "0.1.0"
copyright = "Copyright (c) 2026 USBBackup"
category = "public.app-category.utilities"
short_description = "Automatic USB Flash Drive Backup & Safe Eject Utility"
long_description = """
Background menu bar / system tray utility that automatically copies the contents of newly inserted USB flash drives to a configured backup folder and safely ejects the drive.
"""
